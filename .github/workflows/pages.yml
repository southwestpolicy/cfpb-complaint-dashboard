name: Deploy dashboard to Pages

# Publishing is deliberately separate from the monthly data refresh.
#
# Coupling them meant Pages could not go live until the refresh had succeeded,
# and the refresh cannot succeed until the state release exists -- so a fresh
# repository had no way to publish anything. Splitting them means the site
# deploys from whatever is committed, immediately, and the monthly job simply
# commits new data and lets this workflow pick it up.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/public/**'
      - 'wordpress/sppi-cfpb-dashboard/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments overlap; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage assets
        # The plugin directory holds the canonical CSS/JS/map; the public site
        # gets a copy so there is only ever one source of truth to edit.
        run: |
          mkdir -p dashboard/public/assets
          cp wordpress/sppi-cfpb-dashboard/assets/dashboard.css   dashboard/public/assets/
          cp wordpress/sppi-cfpb-dashboard/assets/dashboard.js    dashboard/public/assets/
          cp wordpress/sppi-cfpb-dashboard/assets/us-states.json  dashboard/public/assets/

      - name: Verify the payload before publishing
        run: python dashboard/check_payload.py dashboard/public/data/dashboard.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/public

      - id: deploy
        uses: actions/deploy-pages@v4
